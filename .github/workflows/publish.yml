# Publishes moth-companion to PyPI when a v* tag is pushed. Uses PyPI trusted publishing (no token in the repo):
# pypi.org -> Your account -> Publishing -> add a pending publisher with
# project moth-companion, owner riceharvest, repository moth, workflow publish.yml, environment pypi.
name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tag matches moth/VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < moth/VERSION)"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: import check (the built wheel, CPU torch)
        run: |
          python -m venv /tmp/w
          /tmp/w/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/w/bin/pip install -q dist/*.whl
          cd /tmp
          /tmp/w/bin/moth --version
          /tmp/w/bin/moth --help > /dev/null
          /tmp/w/bin/python -c "import moth.serve, moth.setup, moth.update, moth.backends, moth.hooks"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
