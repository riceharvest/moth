# moth's unit tests on Linux, macOS and Windows. GitHub-hosted runners only (never self-hosted): no model weights,
# no GPU, CPU torch. test_engine needs the real tokenizer, so CI fetches just tokenizer.json from the public base repo.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  QT_QPA_PLATFORM: offscreen          # test_pet sets it too; never try to open a window on a runner
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZER_REPO: darioooooo0o/tiny-agent-112m
  TOKENIZER_REVISION: 4397e12be190c10f40e47c9e268e405d78ab0b78   # pinned; bump together with the sha256 below
  TOKENIZER_SHA256: 8b5b984a41969952af13be0f21f8a57f72119bb71779669a282e6d56910fa12f

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: .github/ci-requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Qt runtime libraries and bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            bubblewrap
          # Ubuntu 24.04 lets AppArmor block unprivileged user namespaces, which bwrap needs (test_shell's differential
          # test runs moth's shell against real bash inside bwrap, as tiny_agent's tools do)
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-all true && echo "bwrap works" || echo "::warning::bwrap cannot make namespaces here: test_shell's differential test will skip"

      - name: Install CPU torch (Linux, Windows)
        if: runner.os != 'macOS'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install torch (macOS; the default wheels are CPU / MPS)
        if: runner.os == 'macOS'
        run: python -m pip install torch

      - name: Install test dependencies
        run: python -m pip install -r .github/ci-requirements.txt

      - name: Check Qt loads (so the pet's Qt tests can't skip silently)
        run: python -c "from PySide6 import QtCore, QtGui, QtWidgets; print('PySide6', QtCore.qVersion())"

      - name: Fetch tokenizer.json (no weights)
        if: ${{ !cancelled() }}   # without it moth runs in pip mode and the pet tests try the Hub
        run: |
          python - <<'EOF'
          import hashlib, os
          from huggingface_hub import hf_hub_download
          path = hf_hub_download(os.environ["TOKENIZER_REPO"], "tokenizer.json", revision=os.environ["TOKENIZER_REVISION"],
                                 local_dir="data/tiny-agent-112m")
          digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
          assert digest == os.environ["TOKENIZER_SHA256"], f"tokenizer.json sha256 {digest}"
          print(path, digest)
          EOF

      - name: Lint - compileall
        run: python -m compileall -q moth tiny_agent tests

      - name: Lint - node --check the JS adapters, JSON manifests parse
        if: runner.os == 'Linux'
        run: |
          # .ts / .js adapters are plain ESM JS: check each as .mjs, like the tests load them.
          # Not checked: .d.ts (types only) and claude_code_mod's .tsx (needs a TypeScript compiler).
          tmp="$RUNNER_TEMP/nodecheck"; mkdir -p "$tmp"
          find moth/integrations -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.ts' \) ! -name '*.d.ts' -print0 |
            while IFS= read -r -d '' f; do
              cp "$f" "$tmp/check.mjs"
              node --check "$tmp/check.mjs" || { echo "::error file=$f::node --check failed"; exit 1; }
              echo "ok $f"
            done
          find moth/integrations -type f -name '*.json' -print0 |
            while IFS= read -r -d '' f; do
              python -m json.tool "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; exit 1; }
              echo "ok $f"
            done

      # one step per suite; each runs even when an earlier one failed, so a red run shows every broken suite
      - name: test_engine
        if: ${{ !cancelled() }}
        run: python -m pytest -q -rs -p no:cacheprovider tests/test_engine.py

      - name: test_fast_infer (CPU int8 / bf16 paths, decode step, sampler)
        if: ${{ !cancelled() }}
        run: python -m pytest -q -rs -p no:cacheprovider tests/test_fast_infer.py

      - name: test_norepeat (phrase memory)
        if: ${{ !cancelled() }}
        run: python -m pytest -q -rs -p no:cacheprovider tests/test_norepeat.py

      - name: test_backends (moth.json, model specs, openai fake server, a tiny random transformers model)
        if: ${{ !cancelled() }}
        run: python -m pytest -q -rs -p no:cacheprovider tests/test_backends.py

      - name: test_update
        if: ${{ !cancelled() }}
        run: python -m pytest -q -rs -p no:cacheprovider tests/test_update.py

      - name: test_update_e2e (fake Hub on localhost, real downloads, a tiny real model served)
        if: ${{ !cancelled() }}
        run: python -m pytest -q -rs -p no:cacheprovider tests/test_update_e2e.py

      - name: test_config
        if: ${{ !cancelled() }}
        run: python -m pytest -q -rs -p no:cacheprovider tests/test_config.py

      - name: test_setup
        if: ${{ !cancelled() }}
        run: python -m pytest -q -rs -p no:cacheprovider tests/test_setup.py

      - name: "test_frozen (the installers' app: hooks and autostart run the bundled executables)"
        if: ${{ !cancelled() }}
        run: python -m pytest -q -rs -p no:cacheprovider tests/test_frozen.py

      - name: test_pet
        if: ${{ !cancelled() }}
        run: python -m pytest -q -rs -p no:cacheprovider tests/test_pet.py

      - name: test_shell
        if: ${{ !cancelled() }}
        run: python -m pytest -q -rs -p no:cacheprovider tests/test_shell.py

      - name: test_eval_probes
        if: ${{ !cancelled() }}
        run: python -m pytest -q -rs -p no:cacheprovider tests/test_eval_probes.py

      - name: test_cli_tools
        if: ${{ !cancelled() && hashFiles('tests/test_cli_tools.py') != '' }}
        run: python -m pytest -q -rs -p no:cacheprovider tests/test_cli_tools.py

      - name: test_integrations (adapters, node)
        if: ${{ !cancelled() }}
        run: python -m pytest -q -rs -p no:cacheprovider moth/integrations/test_integrations.py
