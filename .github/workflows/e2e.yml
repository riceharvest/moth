# moth's coding-agent hooks against the REAL harness CLIs (Claude Code, Codex; Pi and OpenCode as a bonus) on Linux,
# macOS and Windows, with a fake model (tests/e2e/fake_llm.py) and serve.py's real handler in front of a recording stub
# (tests/e2e/fake_moth.py): no weights, no API keys, no GPU. GitHub-hosted runners only, never self-hosted.
# Plus a by-eye check: the real desktop pet with a reaction in its bubble, screenshotted on Windows and macOS.
name: e2e

on:
  push:
    branches: [main, e2e-harness]
    paths:
      - moth/hooks.py
      - moth/integrations/**
      - moth/pet.py
      - moth/serve.py
      - tests/e2e/**
      - .github/workflows/e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # the versions moth's README was checked against; opencode is the newest (the adapter was written for 1.2.10)
  CLAUDE_CODE_VERSION: 2.1.302
  CODEX_VERSION: 0.163.0
  PI_VERSION: 1.3.0

jobs:
  hooks:
    name: hooks / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the harness CLIs (npm)
        run: |
          npm install -g --no-fund --no-audit "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" "@openai/codex@$CODEX_VERSION" \
            "@earendil-works/pi-coding-agent@$PI_VERSION" opencode-ai@latest
          for b in claude codex pi opencode; do echo "$b: $(command -v $b) $($b --version 2>&1 | head -1)"; done

      - name: e2e, plain python (the repo copy's path has a space)
        run: python tests/e2e/run_e2e.py --soft pi opencode --work "$RUNNER_TEMP" --out e2e-out/plain

      - name: e2e, python in a venv whose path has a space
        if: ${{ !cancelled() }}
        run: python tests/e2e/run_e2e.py --soft pi opencode --spaced-python --work "$RUNNER_TEMP" --out e2e-out/spaced-python

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-hooks-${{ matrix.os }}
          path: e2e-out/
          if-no-files-found: warn

  pet:
    name: pet screenshot / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PySide6
        run: python -m pip install PySide6

      - name: Real pet + fake moth, one reaction, screenshots
        run: python tests/e2e/pet_shot.py --out pet-out

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-pet-${{ matrix.os }}
          path: pet-out/
          if-no-files-found: warn
