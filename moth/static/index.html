<style>
  :root {
    --night: #120f0c; --night-2: #1a1611; --paper: #f1e6d0; --ink: #2a2118;
    --lamp: #e8b765; --lamp-soft: rgba(232, 183, 101, .16); --dust: #8c7d68; --line: #2c251d;
    --you: #2a3a3f; --you-ink: #d7e4e6; --term: #0b0a08; --term-ink: #c9d8a8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--night); color: var(--paper);
    font-family: "Fraunces", Georgia, serif; font-size: 17px;
    display: grid; grid-template-columns: 1fr 240px; grid-template-rows: auto 1fr auto;
    grid-template-areas: "head head" "chat home" "input home"; overflow: hidden;
  }
  /* the lamp: brightens while moth thinks */
  body::before {
    content: ""; position: fixed; inset: -20vh -10vw auto auto; width: 70vw; height: 70vh; pointer-events: none;
    background: radial-gradient(closest-side, var(--lamp-soft), transparent 70%);
    transition: opacity .8s ease, transform 1.6s ease; opacity: .55;
  }
  body.thinking::before { opacity: 1; transform: scale(1.08); }
  header {
    grid-area: head; display: flex; align-items: center; gap: 14px; padding: 18px 24px 12px;
    border-bottom: 1px solid var(--line); position: relative;
  }
  /* the moth (DBCLS silkmoth, CC BY 4.0; inline SVG below): the art drawn three times, clipped to the left wing, the
     right wing and the body. While moth thinks the wings flap: squashed toward their roots (410,470 and 590,470 in
     the art's units) and turned a little, as the desktop pet does */
  header .mothicon { flex: none; width: 64px; height: 50px; overflow: visible; }
  header .mothicon .wing { transform-box: view-box; }
  header .mothicon .wl { transform-origin: 410px 470px; }
  header .mothicon .wr { transform-origin: 590px 470px; }
  body.thinking header .mothicon { animation: flutter .35s ease-in-out infinite alternate; }
  body.thinking header .mothicon .wl { animation: flapl .2s ease-in-out infinite alternate; }
  body.thinking header .mothicon .wr { animation: flapr .2s ease-in-out infinite alternate; }
  @keyframes flutter { from { transform: rotate(-3deg) translateY(1px); } to { transform: rotate(3deg) translateY(-1px); } }
  @keyframes flapl { from { transform: none; } to { transform: rotate(-5deg) scaleX(.24); } }
  @keyframes flapr { from { transform: none; } to { transform: rotate(5deg) scaleX(.24); } }
  @media (prefers-reduced-motion: reduce) { body.thinking header .mothicon, body.thinking header .mothicon .wing { animation-duration: 1.2s; } }
  header h1 { font-weight: 600; font-size: 26px; margin: 0; letter-spacing: .01em; }
  header p { margin: 2px 0 0; color: var(--dust); font-size: 13px; font-family: "JetBrains Mono", monospace; }
  header .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  /* several agent sessions: "2 agents active · 1 skipped" and a filter for their cards (moth's replies always show) */
  header .agents { color: var(--dust); font: 12px "JetBrains Mono", monospace; white-space: nowrap; }
  header select {
    background: transparent; color: var(--dust); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 6px; font: 12px "JetBrains Mono", monospace; max-width: 180px; cursor: pointer;
  }
  header select:hover, header select:focus { color: var(--lamp); border-color: var(--lamp); outline: none; }
  header select option { background: var(--night-2); color: var(--paper); }
  [hidden] { display: none !important; }
  button.ghost {
    background: transparent; color: var(--dust); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; font: 12px "JetBrains Mono", monospace; cursor: pointer;
  }
  button.ghost:hover { color: var(--lamp); border-color: var(--lamp); }
  #chat { grid-area: chat; overflow-y: auto; padding: 22px 24px 12px; position: relative; scroll-behavior: smooth; }
  .row { display: flex; margin: 10px 0; }
  .row.you { justify-content: flex-end; }
  .bubble { max-width: min(560px, 78%); padding: 10px 14px; border-radius: 14px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
  .moth .bubble { background: var(--paper); color: var(--ink); border-bottom-left-radius: 4px; box-shadow: 0 0 28px rgba(232, 183, 101, .12); }
  .you .bubble { background: var(--you); color: var(--you-ink); border-bottom-right-radius: 4px; font-family: system-ui, sans-serif; font-size: 15px; }
  .slip {
    margin: 6px 0 6px 2px; max-width: min(560px, 86%); background: var(--term); border: 1px solid var(--line);
    border-left: 3px solid var(--lamp); border-radius: 6px; font: 12.5px/1.45 "JetBrains Mono", monospace; color: var(--term-ink);
  }
  .slip { background: transparent; border: 0; border-left: 2px solid var(--line); border-radius: 0; color: var(--dust); }
  .slip .peek { padding: 2px 10px; cursor: pointer; user-select: none; font-size: 12px; }
  .slip .peek:hover { color: var(--lamp); }
  .slip .body { display: none; background: var(--term); border: 1px solid var(--line); border-left: 3px solid var(--lamp); border-radius: 6px; margin: 4px 0 2px; color: var(--term-ink); }
  .slip.open .body { display: block; }
  .slip .cmd { padding: 6px 10px; color: var(--lamp); border-bottom: 1px dashed var(--line); }
  .slip pre { margin: 0; padding: 6px 10px 8px; white-space: pre-wrap; max-height: 180px; overflow: auto; }
  .note { color: var(--dust); font: 12.5px "JetBrains Mono", monospace; text-align: center; margin: 12px auto; max-width: 480px; }
  .agentcard {
    margin: 10px 0; max-width: min(560px, 86%); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px;
    color: var(--dust); font: 13px/1.45 system-ui, sans-serif; background: rgba(255,255,255,.02); cursor: pointer;
  }
  .agentcard b { color: var(--you-ink); font-weight: 600; font-size: 12px; letter-spacing: .02em; }
  .agentcard .txt { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .agentcard.skipped { opacity: .55; }
  .agentcard i { font-style: normal; font-size: 11px; margin-left: 6px; }
  .agentcard.open .txt { display: block; }
  .hint { color: var(--dust); font-size: 14px; text-align: center; margin: 28vh auto 0; max-width: 360px; line-height: 1.5; }
  .dots span { display: inline-block; width: 5px; height: 5px; margin: 0 2px; background: var(--ink); border-radius: 50%; opacity: .3; animation: d 1s infinite; }
  .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes d { 50% { opacity: 1; } }
  form { grid-area: input; display: flex; gap: 10px; padding: 12px 24px 20px; border-top: 1px solid var(--line); }
  input[type=text] {
    flex: 1; background: var(--night-2); border: 1px solid var(--line); border-radius: 10px; color: var(--paper);
    padding: 12px 14px; font: 16px system-ui, sans-serif; outline: none;
  }
  input[type=text]:focus { border-color: var(--lamp); }
  form button { background: var(--lamp); color: var(--ink); border: 0; border-radius: 10px; padding: 0 18px; font: 600 15px "Fraunces", serif; cursor: pointer; }
  form button:disabled { opacity: .5; cursor: wait; }
  aside { grid-area: home; border-left: 1px solid var(--line); padding: 18px 16px; overflow-y: auto; font: 13px/1.6 "JetBrains Mono", monospace; color: var(--dust); }
  aside h2 { font: 600 13px "JetBrains Mono", monospace; color: var(--paper); margin: 0 0 8px; }
  aside .dir { color: var(--lamp); margin-top: 6px; }
  aside .f { padding-left: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  aside .f.new { color: var(--paper); animation: glow 2.5s ease-out; }
  @keyframes glow { from { text-shadow: 0 0 10px var(--lamp); } to { text-shadow: none; } }
  aside .empty { padding-left: 14px; opacity: .5; }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-areas: "head" "chat" "input"; }
    aside { display: none; }
    header, #chat, form { padding-left: 16px; padding-right: 16px; }
    header .actions button:first-of-type, header .agents { display: none; }
  }
</style>
</head>

  <div>
    <h1>moth</h1>
    <p>112M little numbers on a graphics card</p>
  </div>
  <div class="actions">
    <span class="agents" id="agents" hidden></span>
    <select id="only" title="show the cards of one agent session" hidden><option value="">all agents</option></select>
    <button class="ghost" id="newhome" title="give moth a fresh home folder">new home</button>
    <button class="ghost" id="reset" title="forget this chat (files stay)">new chat</button>
  </div>
</header>
<main id="chat"><p class="hint" id="hint">say hi. moth lives in the folders on the right, and can look at them and write in them.</p></main>
<aside><h2>~</h2><div id="tree"></div></aside>
<form id="f" autocomplete="off">
  <input type="text" id="t" placeholder="talk to moth…" maxlength="500" autofocus>
  <button id="send">send</button>
</form>
<script>
const chat = document.getElementById("chat"), t = document.getElementById("t"), send = document.getElementById("send");
const TOKEN = document.querySelector('meta[name="moth-token"]').content;   // put in by moth.serve when it serves this page
const NAMES = { "claude-code": "claude", codex: "codex", hermes: "hermes", pi: "pi", opencode: "opencode", dsh: "deepseek" };
const HELLOS = ["oh! hi. i was sitting on the warm lamp. what's up?", "hello. i'm moth. i live in the folders over there.",
                "hi! it's cozy in here today. the fan is humming."];
const ANSI = /\x1b\[[0-?]*[ -\/]*[@-~]|\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)?|\x1b[@-_]|[\x00-\x08\x0b-\x1f\x7f-\x9f]/g;
let known = null;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function clean(text) { return String(text ?? "").replace(ANSI, ""); }
function bottom() { chat.scrollTop = chat.scrollHeight; }
function say(who, text) {
  document.getElementById("hint")?.remove();
  const r = el("div", "row " + who); r.appendChild(el("div", "bubble", clean(text))); chat.appendChild(r); bottom(); return r;
}
function note(text) { chat.appendChild(el("p", "note", text)); bottom(); }
// a tool use is a folded slip: "moth peeked in diary/ ▸"; click to see the command and what came back
function peekLine(ev) {
  const a = ev.args || {}, cmd = String(a.command || "").trim(), words = cmd.split(/\s+/), path = a.path || "";
  const where = (w) => String(w || "").replace(/^(\/work\/?|~\/?)/, "") || "home";
  if (ev.tool === "write") return "moth wrote " + where(path);
  if (ev.tool === "read") return "moth read " + where(path);
  if (ev.tool === "bash" && words[0] === "ls") {
    const dirs = words.slice(1).filter((w) => !w.startsWith("-"));
    return "moth peeked in " + (dirs.length ? dirs.map(where).join(", ") : "home");
  }
  if (ev.tool === "bash" && ["cat", "head", "wc"].includes(words[0])) {
    return "moth read " + words.slice(1).filter((w) => !w.startsWith("-") && !/^\d+$/.test(w)).map(where).join(", ");
  }
  return "moth tried something";
}
function slip(ev) {
  const s = el("div", "slip"), a = ev.args || {};
  const peek = el("div", "peek", peekLine(ev) + " ▸"); peek.title = "click to see what moth saw";
  peek.onclick = () => { s.classList.toggle("open"); peek.textContent = peekLine(ev) + (s.classList.contains("open") ? " ▾" : " ▸"); };
  const cmd = ev.tool === "bash" ? "$ " + (a.command || "") : ev.tool === "read" ? "$ cat " + (a.path || "") :
              ev.tool === "write" ? "✎ " + (a.path || "") : ev.tool;
  const body = ev.tool === "read" ? (ev.result || "").replace(/^ *\d+\t/gm, "") : ev.tool === "write" ? (a.content || "") : ev.result;
  const box = el("div", "body"); box.appendChild(el("div", "cmd", clean(cmd))); box.appendChild(el("pre", "", clean(body)));
  s.appendChild(peek); s.appendChild(box);
  chat.appendChild(s); bottom();
}
function tree(data) {
  const box = document.getElementById("tree"); box.innerHTML = "";
  const now = new Set();
  for (const d of data) {
    box.appendChild(el("div", "dir", d.dir + "/"));
    if (!d.files.length) box.appendChild(el("div", "empty", "(empty)"));
    for (const f of d.files) {
      const key = d.dir + "/" + f; now.add(key);
      box.appendChild(el("div", "f" + (known && !known.has(key) ? " new" : ""), f));
    }
  }
  known = now;
}
const HEADERS = { "Content-Type": "application/json", "X-Moth-Token": TOKEN };
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: HEADERS, body: JSON.stringify(body || {}) });
  const d = await r.json(); d.status = r.status; return d;
}
// agent sessions: a card's key is harness + session id; the dropdown lists every session seen in this chat
const only = document.getElementById("only"), seen = new Map();   // key -> "claude · moth-repo"
const keyOf = (ev) => (ev.source || "") + "|" + (ev.session || "");
function nameOf(ev) {
  const who = NAMES[ev.source] || ev.source || "the agent";
  return ev.label ? who + " · " + clean(ev.label) : who;
}
function clearSessions() { seen.clear(); only.replaceChildren(el("option", "", "all agents")); only.firstChild.value = ""; only.hidden = true; }
function sessions(list) {   // add sessions to the dropdown; it shows once there are two or more
  let changed = false;
  for (const ev of list) { const k = keyOf(ev), n = nameOf(ev); if (seen.get(k) !== n) { seen.set(k, n); changed = true; } }
  if (!changed) return;
  const keep = only.value; only.replaceChildren(el("option", "", "all agents")); only.firstChild.value = "";
  for (const [k, n] of seen) { const o = el("option", "", n); o.value = k; only.appendChild(o); }
  only.value = seen.has(keep) ? keep : "";
  only.hidden = seen.size < 2;
}
function filterCards() {
  for (const c of chat.querySelectorAll(".agentcard")) c.hidden = !!only.value && c.dataset.key !== only.value;
}
only.onchange = () => { filterCards(); bottom(); };
function status(a) {
  const box = document.getElementById("agents");
  if (!a || !a.active) { box.hidden = true; return; }
  box.textContent = `${a.active} agent${a.active === 1 ? "" : "s"} active` + (a.skipped ? ` · ${a.skipped} skipped` : "");
  box.title = (a.sessions || []).map(nameOf).join(", ");
  box.hidden = false;
}
function agentCard(ev) {
  document.getElementById("hint")?.remove();
  sessions([ev]);
  const c = el("div", "agentcard" + (ev.skipped ? " skipped" : "")); c.title = "click to expand";
  c.dataset.key = keyOf(ev); c.hidden = !!only.value && c.dataset.key !== only.value;
  c.appendChild(el("b", "", (nameOf(ev) + " said").toUpperCase()));
  if (ev.skipped) c.appendChild(el("i", "", "moth let this one pass"));
  c.appendChild(el("div", "txt", clean(ev.agent)));
  c.onclick = () => c.classList.toggle("open");
  chat.appendChild(c); bottom();
}
function greet(ep) {   // once per chat (log epoch), when moth hasn't said anything yet; not part of moth's memory
  try { if (localStorage.getItem("moth-greeted") === ep) return; localStorage.setItem("moth-greeted", ep); } catch (err) {}
  say("moth", HELLOS[Math.floor(Math.random() * HELLOS.length)]);
}
// the server keeps one log of everything (your messages, agent messages from the hooks, moth's replies); render from it.
// A new epoch = moth restarted or the chat was reset: the server then sends the new log from its start.
let next = 0, epoch = null, typing = null, polling = false, first = true;
async function poll() {
  if (polling) return; polling = true;
  try {
    const q = epoch ? `since=${next}&epoch=${encodeURIComponent(epoch)}` : `since=${next}`;
    const res = await fetch("/api/log?" + q, { headers: { "X-Moth-Token": TOKEN } });
    if (res.status === 401) { if (first) note("moth doesn't know this page (wrong token). reload it from moth itself."); first = false; return; }
    const r = await res.json();
    if (epoch !== null && r.epoch !== epoch) { chat.innerHTML = ""; clearSessions(); if (typing) chat.appendChild(typing); }
    epoch = r.epoch;
    for (const ev of r.events) {
      if (ev.you != null) say("you", ev.you);
      else if (ev.agent != null) agentCard(ev);
      else if (ev.say != null) { typing?.remove(); typing = null; say("moth", ev.say); }
      else slip(ev);
    }
    if (r.events.length && typing) chat.appendChild(typing);   // keep the dots last while moth still works
    if (first && !r.events.length && r.next === 0) greet(r.epoch);
    first = false;
    next = r.next; if (r.tree) tree(r.tree);
    if (r.agents) { sessions(r.agents.sessions || []); status(r.agents); }
  } catch (err) {} finally { polling = false; }
}
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = t.value.trim(); if (!text) return;
  t.value = ""; send.disabled = true; document.body.classList.add("thinking");
  const req = post("/api/chat", { text });
  await poll();
  typing = el("div", "row moth"); const b = el("div", "bubble"); b.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
  typing.appendChild(b); chat.appendChild(typing); bottom();
  try { const r = await req; if (r.status !== 200) note("moth didn't take that: " + (r.error || r.status)); }
  catch (err) { say("moth", "(moth fell asleep. is the server running?)"); }
  await poll(); typing?.remove(); typing = null;
  send.disabled = false; document.body.classList.remove("thinking"); t.focus();
});
async function reset(body) {
  const r = await post("/api/reset", body);
  if (r.status !== 200) { note(r.error || "moth couldn't do that."); return; }
  chat.innerHTML = ""; clearSessions();
  next = 0; epoch = r.epoch; first = true; if (r.tree) tree(r.tree); await poll(); t.focus();
}
document.getElementById("reset").onclick = () => reset();
document.getElementById("newhome").onclick = () => {
  if (!confirm("give moth a brand new home? its current files will be gone.")) return;
  known = null; reset({ new_home: true });
};
poll(); setInterval(poll, 1500);
</script>
